name: Fix Idea Transition Images

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[idea-transition-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Idea → Craft transition
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          marker = '<section class="manifesto">'
          section = '''<section class="idea-craft-transition" aria-label="From idea to craft">
            <div class="wrap">
              <div class="ict-head">
                <span class="eyebrow">A little space between</span>
                <p>Before we talk about craft, let the moments speak.</p>
              </div>
            </div>
            <div class="ict-track">
              <figure class="ict-photo"><img src="" data-media="IDEA-IMG-01" alt="Intimate wedding moment" loading="lazy"></figure>
              <figure class="ict-photo ict-photo-tall"><img src="" data-media="IDEA-IMG-02" alt="Wedding celebration" loading="lazy"></figure>
              <figure class="ict-photo"><img src="" data-media="IDEA-IMG-03" alt="Wedding detail" loading="lazy"></figure>
            </div>
          </section>\n\n'''

          # Strip the malformed transition that was appended after </html>.
          malformed = '<section class="idea-craft-transition" aria-label="A visual pause between the idea and the craft">'
          if malformed in text:
              text = text.split(malformed, 1)[0].rstrip()
              text = text + '\n'
              if text.endswith('</html>'):
                  pass
              else:
                  text += '</html>\n'

          # Insert exactly one valid transition immediately before Manifesto.
          while text.count('data-media="IDEA-IMG-01"'):
              if marker in text and text.count('data-media="IDEA-IMG-01"') > 0:
                  # Remove any valid copy first, then insert the canonical one.
                  import re
                  text = re.sub(r'<section class="idea-craft-transition"[^>]*>.*?</section>\s*', '', text, count=1, flags=re.S)
              break
          if marker not in text:
              raise SystemExit('Manifesto marker not found')
          text = text.replace(marker, section + marker, 1)

          manifest = json.loads(Path('media.json').read_text(encoding='utf-8'))
          required = {'IDEA-IMG-01','IDEA-IMG-02','IDEA-IMG-03'}
          ids = {x.get('id') for x in manifest.get('media', [])}
          if not required.issubset(ids):
              raise SystemExit(f'Missing media IDs: {sorted(required - ids)}')
          if text.count('data-media="IDEA-IMG-01"') != 1:
              raise SystemExit('Expected exactly one IDEA-IMG-01 element')

          index.write_text(text, encoding='utf-8')
          print('Verified Idea → Craft transition and media IDs.')
          PY
      - name: Commit and remove repair files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-idea-transition.yml .idea-transition-trigger .idea-transition-trigger-2
          git commit -m "[idea-transition-fix] restore Idea to Craft images"
          git push