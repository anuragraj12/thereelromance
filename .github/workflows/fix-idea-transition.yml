name: Fix Idea Transition Images

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[idea-transition-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore Idea → Craft transition
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          marker = '<section class="manifesto">'
          if 'data-media="IDEA-IMG-01"' not in text:
              section = '''<section class="idea-craft-transition" aria-label="From idea to craft">
            <div class="wrap">
              <div class="ict-head">
                <span class="eyebrow">A little space between</span>
                <p>Before we talk about craft, let the moments speak.</p>
              </div>
            </div>
            <div class="ict-track">
              <figure class="ict-photo"><img src="" data-media="IDEA-IMG-01" alt="Intimate wedding moment" loading="lazy"></figure>
              <figure class="ict-photo ict-photo-tall"><img src="" data-media="IDEA-IMG-02" alt="Wedding celebration" loading="lazy"></figure>
              <figure class="ict-photo"><img src="" data-media="IDEA-IMG-03" alt="Wedding detail" loading="lazy"></figure>
            </div>
          </section>\n\n'''
              if marker not in text:
                  raise SystemExit('Manifesto marker not found; refusing to modify index.html')
              text = text.replace(marker, section + marker, 1)

          malformed = '<section class="idea-craft-transition" aria-label="A visual pause between the idea and the craft">'
          if malformed in text:
              text = text.split(malformed, 1)[0].rstrip() + '\n'
              if not text.endswith('</html>'):
                  raise SystemExit('Unexpected index.html tail after removing malformed transition')

          index.write_text(text, encoding='utf-8')

          manifest = json.loads(Path('media.json').read_text(encoding='utf-8'))
          ids = {item.get('id') for item in manifest.get('media', [])}
          required = {'IDEA-IMG-01','IDEA-IMG-02','IDEA-IMG-03'}
          if not required.issubset(ids):
              raise SystemExit(f'Missing required media IDs: {sorted(required - ids)}')

          assert all(x in text for x in required)
          print('Idea → Craft transition restored inside <main>; all three media IDs verified.')
          PY

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-idea-transition.yml .idea-transition-trigger
          git commit -m "[idea-transition-fix] restore Idea to Craft images"
          git push